version: "2"
linters:
  default: standard
  enable:
    - perfsprint
    - gocritic
    - nlreturn
    - misspell
    - whitespace
    - copyloopvar
    - usetesting
    - unconvert
    - bodyclose
    - wastedassign
    - nakedret
    - dogsled
    - nestif
    - mirror
    - reassign
    - fatcontext
    - durationcheck
    - makezero
    - usestdlibvars
    - testableexamples
    - intrange
    - thelper
    - unparam
    - predeclared
    - errname
    - prealloc
    - contextcheck
    - nilerr
    - forcetypeassert
    - noctx
    - godot
    - gosec
    - goconst
    - revive
    - lll
    - funlen
    - errorlint
    - modernize
  settings:
    funlen:
      lines: 65
      statements: 40
    lll:
      line-length: 120
    revive:
      rules:
        - name: package-comments
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: unused-parameter
          disabled: false
    varnamelen:
      min-name-length: 2
      ignore-decls:
        - "t: testing.T"
        - "tt: *testing.T"
        - "i: int"
  exclusions:
    # Exclude machine-generated Go files (detected via standard "Code generated"
    # markers) from linting. Replaces an invalid v1-style exclusions.generate
    # block that golangci-lint v2 silently ignored.
    generated: lax
    rules:
      - linters: [funlen]
        path: "_test\\.go"
      - linters: [goconst]
        path: "_test\\.go"
formatters:
  enable:
    - gofmt
    - goimports

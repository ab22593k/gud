version: "2"
linters:
  default: standard
  enable:
    - perfsprint
    - gocritic
    - nlreturn
    - misspell
    - whitespace
    - copyloopvar
    - usetesting
    - godot
    - gosec
    - goconst
    - revive
    - lll
    - funlen
    - errorlint
    - modernize
  settings:
    funlen:
      lines: 65
      statements: 40
    lll:
      line-length: 120
    revive:
      rules:
        - name: package-comments
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: unused-parameter
          disabled: false
    varnamelen:
      min-name-length: 2
      ignore-decls:
        - "t: testing.T"
        - "tt: *testing.T"
        - "i: int"
  exclusions:
    generate:
      rules:
        - linters:
            - lll
          path: \.go
    rules:
      - linters: [funlen]
        path: "_test\\.go"
      - linters: [goconst]
        path: "_test\\.go"
formatters:
  enable:
    - gofmt
    - goimports

version: "2"
linters:
  default: standard
  enable:
    - perfsprint
    - gocritic
    - nlreturn
    - misspell
    - whitespace
    - copyloopvar
    - usetesting
    - unconvert
    - bodyclose
    - wastedassign
    - nakedret
    - dogsled
    - nestif
    - mirror
    - reassign
    - fatcontext
    - durationcheck
    - makezero
    - usestdlibvars
    - testableexamples
    - intrange
    - thelper
    - unparam
    - predeclared
    - errname
    - nolintlint
    - prealloc
    - contextcheck
    - nilerr
    - forcetypeassert
    - noctx
    - wsl_v5
    - godot
    - gosec
    - goconst
    - revive
    - lll
    - funlen
    - errorlint
    - modernize
  settings:
    # Accepted-risk classes for this local CLI tool:
    #   G204: subprocesses always use the fixed "git"/"docker" binary; arguments
    #         come from internal callers (git output / local config), never
    #         from remote or untrusted user input.
    #   G304: reading files whose paths come from git output (repo-relative
    #         paths) or the CLI's own resolved config locations.
    #   G301: intentionally permissive (0755) fixture directories in tests.
    gosec:
      excludes:
        - G204
        - G304
        - G301
    funlen:
      lines: 65
      statements: 40
    lll:
      line-length: 120
    revive:
      rules:
        - name: package-comments
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: unused-parameter
          disabled: false
        # Naming: MixedCaps, initialism casing (ID/URL/SHA), no ALL_CAPS, and
        # package-name stutter. These were previously unchecked because an
        # explicit rules list suppresses revive's default set.
        - name: var-naming
          disabled: false
        # Error strings must be lowercase (including acronyms) and unpunctuated.
        - name: error-strings
          disabled: false
    nolintlint:
      # Every //nolint must name its linter and justify itself.
      # allow-unused stays at its default (true): gosec G204/G304/G301 and
      # goconst-in-tests are already excluded globally, so nearly every
      # directive here reads as "unused". Deleting them is not safe -- some
      # double as package comments or supply the blank line wsl_v5 wants, and
      # one of them suppresses a live gosec finding.
      require-explanation: true
      require-specific: true
      allow-unused: true
    staticcheck:
      # golangci-lint's default staticcheck set excludes ST1003 (naming:
      # MixedCaps and initialism casing) and keeps ST1005 (error strings). This
      # is the default list with the ST1003 exclusion dropped, so naming is
      # enforced. ST1005 stays enabled.
      checks:
        - all
        - -ST1000
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
  exclusions:
    # Exclude machine-generated Go files (detected via standard "Code generated"
    # markers) from linting. Replaces an invalid v1-style exclusions.generate
    # block that golangci-lint v2 silently ignored.
    generated: lax
    rules:
      - linters: [funlen]
        path: "_test\\.go"
      - linters: [goconst]
        path: "_test\\.go"
formatters:
  enable:
    - gofmt
    - goimports
